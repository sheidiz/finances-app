name: Bug report
description: Report unexpected behavior
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Actual and expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
