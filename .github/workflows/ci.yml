name: CI
on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whitespace, JSON and PowerShell syntax
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF")
          elif [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git hash-object -t tree -w /dev/null)
          fi
          git diff --check "$base" HEAD --
          python3 -m json.tool .github/release-please-config.json >/dev/null
          python3 -m json.tool .release-please-manifest.json >/dev/null
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/setup.ps1).Path, [ref]$tokens, [ref]$errors); if ($errors) { $errors | Out-String | Write-Error; exit 1 }'
